name = "touchstone-edge"
main = "apps/edge/worker.js"
compatibility_date = "2026-07-28"
workers_dev = true
routes = [
  { pattern = "touchstone.jefflin.ai/*", zone_name = "jefflin.ai" }
]

[vars]
LOCAL_ORIGIN = "https://touchstone-origin.jefflin.ai"

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
