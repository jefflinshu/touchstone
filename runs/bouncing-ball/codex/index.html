<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旋转六边形弹跳小球</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #030510;
      --bg-1: #08101f;
      --cyan: #67f7ff;
      --blue: #4d7dff;
      --pink: #ff4fd8;
      --gold: #ffd36f;
      --text: #dcecff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(40, 90, 180, 0.18), transparent 34%),
        radial-gradient(circle at 18% 18%, rgba(103, 247, 255, 0.12), transparent 25%),
        radial-gradient(circle at 82% 72%, rgba(255, 79, 216, 0.10), transparent 28%),
        linear-gradient(135deg, var(--bg-0), var(--bg-1) 48%, #02030a);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
    }

    body::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background: radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.62) 100%);
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 420px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .caption {
      position: fixed;
      left: 50%;
      bottom: clamp(18px, 4vh, 42px);
      z-index: 2;
      transform: translateX(-50%);
      color: rgba(220, 236, 255, 0.76);
      font-size: clamp(12px, 1.5vw, 14px);
      line-height: 1.45;
      letter-spacing: 0;
      text-align: center;
      text-shadow: 0 0 18px rgba(103, 247, 255, 0.45);
      user-select: none;
      white-space: nowrap;
    }

    @media (max-width: 560px) {
      .caption {
        bottom: 16px;
        width: calc(100vw - 32px);
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="发光小球在旋转六边形内部弹跳的动画">
    <canvas id="stage"></canvas>
    <div class="caption">gravity · rotating boundary · elastic collision</div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const TAU = Math.PI * 2;

      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        center: { x: 0, y: 0 },
        hexRadius: 240,
        angle: 0,
        rotationSpeed: 0.72,
        gravity: 820,
        restitution: 0.86,
        wallFriction: 0.992,
        airDrag: 0.999,
        ball: {
          x: 0,
          y: 0,
          vx: 210,
          vy: -40,
          radius: 18,
          spin: 0
        },
        trail: []
      };

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        canvas.style.width = `${state.width}px`;
        canvas.style.height = `${state.height}px`;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        state.center.x = state.width / 2;
        state.center.y = state.height / 2;
        state.hexRadius = Math.max(150, Math.min(state.width, state.height) * 0.34);
        state.ball.radius = Math.max(12, Math.min(22, state.hexRadius * 0.072));

        if (!state.hasResized) {
          state.ball.x = state.center.x - state.hexRadius * 0.14;
          state.ball.y = state.center.y - state.hexRadius * 0.36;
          state.hasResized = true;
        } else {
          keepBallNearCenter();
        }
      }

      function keepBallNearCenter() {
        const dx = state.ball.x - state.center.x;
        const dy = state.ball.y - state.center.y;
        const maxDistance = state.hexRadius - state.ball.radius * 2.6;
        const distance = Math.hypot(dx, dy);

        if (distance > maxDistance) {
          const scale = maxDistance / distance;
          state.ball.x = state.center.x + dx * scale;
          state.ball.y = state.center.y + dy * scale;
        }
      }

      function getHexPoints(angle) {
        const points = [];
        for (let i = 0; i < 6; i += 1) {
          const a = angle + i * TAU / 6 - Math.PI / 2;
          points.push({
            x: state.center.x + Math.cos(a) * state.hexRadius,
            y: state.center.y + Math.sin(a) * state.hexRadius
          });
        }
        return points;
      }

      function inwardNormal(a, b) {
        const edgeX = b.x - a.x;
        const edgeY = b.y - a.y;
        let nx = -edgeY;
        let ny = edgeX;
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2;

        if ((state.center.x - midX) * nx + (state.center.y - midY) * ny < 0) {
          nx *= -1;
          ny *= -1;
        }

        const length = Math.hypot(nx, ny) || 1;
        return { x: nx / length, y: ny / length };
      }

      function wallVelocityAt(x, y) {
        const omega = state.rotationSpeed;
        const rx = x - state.center.x;
        const ry = y - state.center.y;
        return {
          x: -omega * ry,
          y: omega * rx
        };
      }

      function collideWithHexagon(points) {
        const ball = state.ball;

        for (let i = 0; i < points.length; i += 1) {
          const a = points[i];
          const b = points[(i + 1) % points.length];
          const n = inwardNormal(a, b);
          const signedDistance = (ball.x - a.x) * n.x + (ball.y - a.y) * n.y;

          if (signedDistance < ball.radius) {
            const penetration = ball.radius - signedDistance;
            ball.x += n.x * penetration;
            ball.y += n.y * penetration;

            const contactX = ball.x - n.x * ball.radius;
            const contactY = ball.y - n.y * ball.radius;
            const wallVelocity = wallVelocityAt(contactX, contactY);
            const relativeVx = ball.vx - wallVelocity.x;
            const relativeVy = ball.vy - wallVelocity.y;
            const normalSpeed = relativeVx * n.x + relativeVy * n.y;

            if (normalSpeed < 0) {
              ball.vx -= (1 + state.restitution) * normalSpeed * n.x;
              ball.vy -= (1 + state.restitution) * normalSpeed * n.y;

              const tangentX = -n.y;
              const tangentY = n.x;
              const tangentSpeed = ball.vx * tangentX + ball.vy * tangentY;
              ball.vx -= tangentSpeed * (1 - state.wallFriction) * tangentX;
              ball.vy -= tangentSpeed * (1 - state.wallFriction) * tangentY;
              ball.vx += wallVelocity.x * 0.018;
              ball.vy += wallVelocity.y * 0.018;
              ball.spin += tangentSpeed * 0.0009;
            }
          }
        }
      }

      function update(dt) {
        const ball = state.ball;
        state.angle += state.rotationSpeed * dt;

        ball.vy += state.gravity * dt;
        ball.vx *= Math.pow(state.airDrag, dt * 60);
        ball.vy *= Math.pow(state.airDrag, dt * 60);
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.spin *= 0.993;

        const points = getHexPoints(state.angle);
        for (let i = 0; i < 3; i += 1) {
          collideWithHexagon(points);
        }

        state.trail.push({ x: ball.x, y: ball.y, radius: ball.radius, life: 1 });
        if (state.trail.length > 28) state.trail.shift();
        state.trail.forEach((p) => {
          p.life -= dt * 2.9;
        });
        state.trail = state.trail.filter((p) => p.life > 0);
      }

      function drawBackground() {
        ctx.clearRect(0, 0, state.width, state.height);

        const glow = ctx.createRadialGradient(
          state.center.x,
          state.center.y,
          state.hexRadius * 0.12,
          state.center.x,
          state.center.y,
          state.hexRadius * 1.45
        );
        glow.addColorStop(0, "rgba(103, 247, 255, 0.10)");
        glow.addColorStop(0.45, "rgba(77, 125, 255, 0.06)");
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, state.width, state.height);
      }

      function drawHexagon(points) {
        ctx.save();
        ctx.beginPath();
        points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();

        const fill = ctx.createRadialGradient(
          state.center.x,
          state.center.y,
          state.hexRadius * 0.1,
          state.center.x,
          state.center.y,
          state.hexRadius
        );
        fill.addColorStop(0, "rgba(18, 32, 62, 0.16)");
        fill.addColorStop(1, "rgba(6, 11, 26, 0.34)");
        ctx.fillStyle = fill;
        ctx.fill();

        ctx.shadowColor = "rgba(103, 247, 255, 0.78)";
        ctx.shadowBlur = 24;
        ctx.lineWidth = Math.max(2, state.hexRadius * 0.014);
        ctx.strokeStyle = "rgba(103, 247, 255, 0.84)";
        ctx.stroke();

        ctx.shadowColor = "rgba(255, 79, 216, 0.32)";
        ctx.shadowBlur = 32;
        ctx.lineWidth = Math.max(1, state.hexRadius * 0.006);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.38)";
        ctx.stroke();

        points.forEach((point) => {
          ctx.beginPath();
          ctx.arc(point.x, point.y, Math.max(3, state.hexRadius * 0.018), 0, TAU);
          ctx.fillStyle = "rgba(255, 211, 111, 0.92)";
          ctx.shadowColor = "rgba(255, 211, 111, 0.95)";
          ctx.shadowBlur = 18;
          ctx.fill();
        });
        ctx.restore();
      }

      function drawBall() {
        const ball = state.ball;

        state.trail.forEach((p) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life) * 0.22;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * (1.7 - p.life * 0.35), 0, TAU);
          ctx.fillStyle = "rgba(103, 247, 255, 0.42)";
          ctx.shadowColor = "rgba(103, 247, 255, 0.75)";
          ctx.shadowBlur = 26;
          ctx.fill();
          ctx.restore();
        });

        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.spin);

        const aura = ctx.createRadialGradient(0, 0, ball.radius * 0.25, 0, 0, ball.radius * 4.1);
        aura.addColorStop(0, "rgba(103, 247, 255, 0.34)");
        aura.addColorStop(0.35, "rgba(77, 125, 255, 0.16)");
        aura.addColorStop(1, "rgba(103, 247, 255, 0)");
        ctx.beginPath();
        ctx.arc(0, 0, ball.radius * 4.1, 0, TAU);
        ctx.fillStyle = aura;
        ctx.fill();

        const body = ctx.createRadialGradient(-ball.radius * 0.38, -ball.radius * 0.48, 2, 0, 0, ball.radius * 1.3);
        body.addColorStop(0, "#ffffff");
        body.addColorStop(0.18, "#aafcff");
        body.addColorStop(0.58, "#39d9ff");
        body.addColorStop(1, "#1745ff");
        ctx.shadowColor = "rgba(103, 247, 255, 1)";
        ctx.shadowBlur = 34;
        ctx.beginPath();
        ctx.arc(0, 0, ball.radius, 0, TAU);
        ctx.fillStyle = body;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.72)";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-ball.radius * 0.36, -ball.radius * 0.42, ball.radius * 0.23, 0, TAU);
        ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
        ctx.fill();
        ctx.restore();
      }

      function drawEnergyLines(points) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < points.length; i += 1) {
          const a = points[i];
          const b = points[(i + 2) % points.length];
          const pulse = 0.5 + Math.sin(performance.now() * 0.002 + i) * 0.5;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(77, 125, 255, ${0.025 + pulse * 0.035})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.restore();
      }

      function render() {
        const points = getHexPoints(state.angle);
        drawBackground();
        drawEnergyLines(points);
        drawHexagon(points);
        drawBall();
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000 || 0);
        last = now;
        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize, { passive: true });
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
